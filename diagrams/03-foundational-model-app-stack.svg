        <rect x="60" y="292" width="208" height="88" rx="6" fill="#EFECE6" stroke="#0F2547" stroke-width="1"/>
        <text x="76" y="316" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">AUTOMATIZACIÓN CLI</text>
        <text x="76" y="338" fill="#0F2547" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Runner con Auto-Teardown</text>
        <text x="76" y="358" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace">trap cleanup EXIT INT TERM</text>

        <!-- Node 3 (FOCAL GOLD): Cloud TPU v5e LoRA Adaptation -->
        <rect x="356" y="116" width="288" height="88" rx="6" fill="#c59216" fill-opacity="0.12" stroke="#C59216" stroke-width="1.6"/>
        <text x="376" y="140" fill="#9A6F0B" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">FOCAL · CLOUD TPU V5E</text>
        <text x="376" y="162" fill="#0F2547" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Flax NNX + LoRA (rank=4)</text>
        <text x="376" y="182" fill="#9A6F0B" font-size="9" font-family="'Geist Mono', monospace" font-weight="500">97.9% congelado · Completion Mask</text>

        <!-- Node 4: Vertex AI GPU L4 -->
        <rect x="356" y="292" width="288" height="88" rx="6" fill="#FFFFFF" stroke="#0F2547" stroke-width="1"/>
        <text x="376" y="316" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">VERTEX AI CUSTOM JOB</text>
        <text x="376" y="338" fill="#0F2547" font-size="14" font-weight="600" font-family="'Geist', sans-serif">GPU NVIDIA L4 (g2-standard-4)</text>
        <text x="376" y="358" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace">Embeddings, Búsqueda y Fine-Tuning</text>

        <!-- Node 5 (FOCAL GOLD): Weight Merge W_base + A @ B -->
        <rect x="772" y="116" width="212" height="88" rx="6" fill="#c59216" fill-opacity="0.12" stroke="#C59216" stroke-width="1.6"/>
        <text x="788" y="140" fill="#9A6F0B" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">FOCAL · FUSIÓN PESOS</text>
        <text x="788" y="162" fill="#0F2547" font-size="13" font-weight="600" font-family="'Geist', sans-serif">W_merged = W_base + A@B</text>
        <text x="788" y="182" fill="#9A6F0B" font-size="9" font-family="'Geist Mono', monospace" font-weight="500">Δ &lt; 1e-5 · 1 sola rama XLA</text>

        <!-- Node 6: Cloud Run Scale-to-Zero -->
        <rect x="772" y="292" width="212" height="88" rx="6" fill="#FFFFFF" stroke="#0F2547" stroke-width="1"/>
        <text x="788" y="316" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SERVING SERVERLESS</text>
        <text x="788" y="338" fill="#0F2547" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Cloud Run (min=0)</text>
        <text x="788" y="358" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace">POST /v1/triage · $0 reposo</text>

