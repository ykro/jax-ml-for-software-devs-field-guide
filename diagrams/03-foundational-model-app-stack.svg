        <rect x="460" y="492" width="20" height="12" rx="2" fill="#FFFFFF" stroke="#0F2547" stroke-width="1"/>
        <text x="488" y="502" fill="#3B5B8C" font-size="8.5" font-family="'Geist', sans-serif">Validación determinista / Endpoint HTTP</text>

        <rect x="740" y="492" width="20" height="12" rx="2" fill="#EFECE6" stroke="#0F2547" stroke-width="1"/>
