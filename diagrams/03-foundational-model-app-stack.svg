<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fm-app-stack-title fm-app-stack-desc" id="d-03-foundational-model-app-stack-root">
        <title id="fm-app-stack-title">De tests deterministas en local a fine-tuning LoRA on-demand y Cloud Run</title>
        <desc id="fm-app-stack-desc">Arquitectura de extremo a extremo para la Serie B: validación local con pytest y Outside Judges, entrenamiento on-demand con auto-teardown en Cloud TPU v5e o GPU L4, fusión de pesos LoRA y despliegue serverless en Cloud Run.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-03-foundational-model-app-stack-root { --color-paper:   #F7F6F2;
      --color-paper-2: #EFECE6;
      --color-ink:     #0F2547;
      --color-muted:   #3B5B8C;
      --color-accent:  #C59216;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #d-03-foundational-model-app-stack-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-03-foundational-model-app-stack-root .diagram-container { width: 100%; overflow-x: auto; }
      #d-03-foundational-model-app-stack-root .diagram-container { overflow-x: visible; }</style>
          <pattern id="d-03-foundational-model-app-stack-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#0f2547" fill-opacity="0.10"/>
          </pattern>
          <marker id="d-03-foundational-model-app-stack-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3B5B8C"/></marker>
          <marker id="d-03-foundational-model-app-stack-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C59216"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#F7F6F2"/>
        <rect width="100%" height="100%" fill="url(#d-03-foundational-model-app-stack-dots)" opacity="0.55"/>

        <!-- Zones -->
        <rect x="40" y="64" width="248" height="384" rx="8" fill="#0f2547" fill-opacity="0.02" stroke="#0f2547" stroke-opacity="0.16" stroke-width="0.8"/>
        <rect x="56" y="68" width="192" height="16" rx="2" fill="#F7F6F2"/>
        <text x="152" y="79" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">1 · DISCIPLINA DE SOFTWARE</text>

        <rect x="336" y="64" width="328" height="384" rx="8" fill="#c59216" fill-opacity="0.04" stroke="#c59216" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="356" y="68" width="284" height="16" rx="2" fill="#F7F6F2"/>
        <text x="498" y="79" fill="#9A6F0B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em" font-weight="600">2 · ADAPTACIÓN ON-DEMAND (AI-EXPERIMENTS)</text>

        <rect x="752" y="64" width="248" height="384" rx="8" fill="#0f2547" fill-opacity="0.02" stroke="#0f2547" stroke-opacity="0.16" stroke-width="0.8"/>
