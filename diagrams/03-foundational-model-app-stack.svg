        <rect x="172" y="236" width="92" height="16" rx="2" fill="#F7F6F2"/>
        <text x="218" y="247" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VERIFY PASS</text>

        <rect x="668" y="132" width="84" height="16" rx="2" fill="#F7F6F2"/>
        <text x="710" y="143" fill="#9A6F0B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em" font-weight="600">LORA A @ B</text>

        <rect x="884" y="236" width="96" height="16" rx="2" fill="#F7F6F2"/>
        <text x="932" y="247" fill="#9A6F0B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em" font-weight="600">0 OVERHEAD</text>

        <!-- Nodes -->
        <!-- Node 1: Local Suite -->
        <rect x="60" y="116" width="208" height="88" rx="6" fill="#FFFFFF" stroke="#0F2547" stroke-width="1"/>
        <text x="76" y="140" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">SUITE DETERMINISTA</text>
        <text x="76" y="162" fill="#0F2547" font-size="13" font-weight="600" font-family="'Geist', sans-serif">Outside Judge &amp; Pytest</text>
        <text x="76" y="182" fill="#3B5B8C" font-size="9" font-family="'Geist Mono', monospace">JSON Schema + Exact Match</text>

