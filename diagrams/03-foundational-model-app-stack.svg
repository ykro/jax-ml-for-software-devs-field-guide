        <path d="M 268,320 H 312 Q 320,320 320,312 V 164 Q 320,156 328,156 H 356" fill="none" stroke="#C59216" stroke-width="1.4" marker-end="url(#d-03-foundational-model-app-stack-arrow-accent)"/>
        <line x1="268" y1="344" x2="356" y2="344" stroke="#3B5B8C" stroke-width="1.2" marker-end="url(#d-03-foundational-model-app-stack-arrow)"/>
