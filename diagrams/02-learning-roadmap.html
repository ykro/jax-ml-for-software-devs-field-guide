<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Aprendizaje · ¿Por qué repositorio empezar?</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #F7F6F2;
      --color-paper-2: #EFECE6;
      --color-ink:     #0F2547;
      --color-muted:   #3B5B8C;
      --color-accent:  #C59216;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1040px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Field Guide de Software Dev a Foundational Models</p>
    <h1>Ruta progresiva desde Python y NumPy hasta desplegar Gemma con LoRA</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1040 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="roadmap-title roadmap-desc">
        <title id="roadmap-title">Ruta progresiva desde Python y NumPy hasta desplegar Gemma con LoRA</title>
        <desc id="roadmap-desc">Diagrama de flujo que orienta al lector hacia el Field Guide de PyTorch a JAX y OpenXLA si ya domina PyTorch, o a través de los cinco repositorios progresivos desde jax-for-software-devs hasta adapting-gemma-for-your-app-in-jax.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(15,37,71,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3B5B8C"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C59216"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#F7F6F2"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- Orthogonal Arrows -->
        <!-- Start -> D1 -->
        <line x1="340" y1="80" x2="340" y2="112" stroke="#3B5B8C" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- D1 -> ruta PyTorch (YES right) -->
        <line x1="468" y1="160" x2="640" y2="160" stroke="#3B5B8C" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- D1 -> 1 (NO down) -->
        <line x1="340" y1="208" x2="340" y2="244" stroke="#3B5B8C" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 1 -> 2 (right) -->
        <line x1="500" y1="276" x2="640" y2="276" stroke="#3B5B8C" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 2 -> 3 (down) -->
        <line x1="800" y1="308" x2="800" y2="368" stroke="#3B5B8C" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 3 -> 4 (left) -->
        <line x1="640" y1="400" x2="500" y2="400" stroke="#3B5B8C" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 4 -> 5 (down, Gold happy path) -->
        <line x1="340" y1="432" x2="340" y2="504" stroke="#C59216" stroke-width="1.6" marker-end="url(#arrow-accent)"/>

        <!-- Arrow Labels -->
        <rect x="532" y="138" width="32" height="14" rx="2" fill="#F7F6F2"/>
        <text x="548" y="148" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">SÍ</text>

        <rect x="352" y="218" width="96" height="14" rx="2" fill="#F7F6F2"/>
        <text x="400" y="228" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">NO (SW DEV)</text>

        <rect x="540" y="254" width="64" height="14" rx="2" fill="#F7F6F2"/>
        <text x="572" y="264" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">PASO 2</text>

        <rect x="812" y="330" width="64" height="14" rx="2" fill="#F7F6F2"/>
        <text x="844" y="340" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">PASO 3</text>

        <rect x="540" y="378" width="64" height="14" rx="2" fill="#F7F6F2"/>
        <text x="572" y="388" fill="#3B5B8C" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">PASO 4</text>

        <rect x="352" y="460" width="128" height="14" rx="2" fill="#F7F6F2"/>
        <text x="416" y="470" fill="#9A6F0B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em" font-weight="600">PASO 5 · DEPLOY</text>

        <!-- Start Node -->
        <rect x="212" y="32" width="256" height="48" rx="20" fill="#EFECE6" stroke="#3B5B8C" stroke-width="1"/>
        <text x="340" y="60" fill="#0F2547" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Punto de Entrada · Tu Perfil</text>

        <!-- Diamond 1: PyTorch background? -->
        <polygon points="340,112 468,160 340,208 212,160" fill="#FFFFFF" stroke="#0F2547" stroke-width="1"/>
        <text x="340" y="156" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">¿Ya entrenas modelos</text>
        <text x="340" y="172" fill="#0F2547" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">en PyTorch a diario?</text>

        <!-- PyTorch route redirect node -->
        <rect x="640" y="132" width="320" height="56" rx="6" fill="#EFECE6" stroke="#3B5B8C" stroke-width="1"/>
        <text x="800" y="156" fill="#0F2547" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ruta PyTorch · De PyTorch a JAX y OpenXLA</text>
        <text x="800" y="174" fill="#3B5B8C" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">jax-openxla-field-guide (5 proyectos)</text>

        <!-- 1: jax-for-software-devs -->
        <rect x="180" y="244" width="320" height="64" rx="6" fill="#FFFFFF" stroke="#0F2547" stroke-width="1"/>
        <text x="340" y="268" fill="#0F2547" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1 · JAX para Software Devs</text>
        <text x="340" y="288" fill="#3B5B8C" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">jax-for-software-devs · jit, grad, vmap</text>

        <!-- 2: ml-from-first-principles-in-jax -->
        <rect x="640" y="244" width="320" height="64" rx="6" fill="#FFFFFF" stroke="#0F2547" stroke-width="1"/>
        <text x="800" y="268" fill="#0F2547" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2 · ML desde Primeros Principios</text>
        <text x="800" y="288" fill="#3B5B8C" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">ml-from-first-principles-in-jax · PyTrees</text>

        <!-- 3: embeddings-and-semantic-search-in-jax -->
        <rect x="640" y="368" width="320" height="64" rx="6" fill="#FFFFFF" stroke="#0F2547" stroke-width="1"/>
        <text x="800" y="392" fill="#0F2547" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3 · Embeddings y Búsqueda Semántica</text>
        <text x="800" y="412" fill="#3B5B8C" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">embeddings-and-semantic-search-in-jax</text>

        <!-- 4: foundational-models-anatomy-in-jax -->
        <rect x="180" y="368" width="320" height="64" rx="6" fill="#FFFFFF" stroke="#0F2547" stroke-width="1"/>
        <text x="340" y="392" fill="#0F2547" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">4 · Anatomía de Foundational Models</text>
        <text x="340" y="412" fill="#3B5B8C" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">foundational-models-anatomy-in-jax · KV Cache</text>

        <!-- 5 (FOCAL GOLD): adapting-gemma-for-your-app-in-jax -->
        <rect x="180" y="504" width="360" height="68" rx="6" fill="rgba(197,146,22,0.12)" stroke="#C59216" stroke-width="1.6"/>
        <text x="360" y="530" fill="#0F2547" font-size="13.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">5 · Adaptar Gemma a tu App (Flax NNX + LoRA)</text>
        <text x="360" y="550" fill="#9A6F0B" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="500">adapting-gemma-for-your-app-in-jax · W_base + A@B</text>

        <!-- Bottom Legend Strip -->
        <line x1="60" y1="600" x2="980" y2="600" stroke="rgba(15,37,71,0.14)" stroke-width="0.8"/>
        <rect x="60" y="612" width="20" height="12" rx="6" fill="#EFECE6" stroke="#3B5B8C" stroke-width="1"/>
        <text x="88" y="622" fill="#3B5B8C" font-size="8.5" font-family="'Geist', sans-serif">Inicio / Ruta paralela</text>

        <polygon points="240,618 252,612 264,618 252,624" fill="#FFFFFF" stroke="#0F2547" stroke-width="1"/>
        <text x="272" y="622" fill="#3B5B8C" font-size="8.5" font-family="'Geist', sans-serif">Decisión de perfil</text>

        <rect x="404" y="612" width="20" height="12" rx="2" fill="#FFFFFF" stroke="#0F2547" stroke-width="1"/>
        <text x="432" y="622" fill="#3B5B8C" font-size="8.5" font-family="'Geist', sans-serif">Repositorios 1 a 4</text>

        <rect x="596" y="612" width="20" height="12" rx="2" fill="rgba(197,146,22,0.14)" stroke="#C59216" stroke-width="1.4"/>
        <text x="624" y="622" fill="#9A6F0B" font-size="8.5" font-family="'Geist', sans-serif" font-weight="600">Capstone de aplicación en producción (repositorio 5)</text>
      </svg>
    </div>
  </div>
</body>
</html>
